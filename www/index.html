function pool(){const p=[];S.cols.forEach((c,i)=>{if(c.on!==false)c.poems.forEach((_,j)=>p.push([i,j]))});return p}
function draw(force){const p=pool();if(!p.length)return null;
 if(!force&&S.daily&&S.daily.d===today()&&S.cols[S.daily.r[0]]&&S.cols[S.daily.r[0]].poems[S.daily.r[1]]!=null)return S.daily.r;
 let r;if(S.mode==="seq"){r=p[S.seq%p.length];S.seq++}else r=p[Math.floor(Math.random()*p.length)];
 S.daily={d:today(),r};save();return r}
const fk=r=>S.cols[r[0]].id+"#"+r[1];
const isFav=r=>S.fav.includes(fk(r));
function card(r){const c=S.cols[r[0]];return `<div class="card" style="--dx:${DX}px"><button class="heart" onclick="event.stopPropagation();fav(${r[0]},${r[1]})">${isFav(r)?"♥":"♡"}</button><div class="orn">${S.glyph||"❦"}</div><div class="poem">${esc(c.poems[r[1]])}</div><div class="src">${esc(c.name)}</div><span class="seal">${S.seal||"詩"}</span></div>`}
let NAV={l:[],i:0},DX=0;
function fav(a,b){const k=fk([a,b]),i=S.fav.indexOf(k);i<0?S.fav.push(k):S.fav.splice(i,1);save();document.querySelectorAll(".heart").forEach(h=>h.textContent=i<0?"♥":"♡");}
function favs(){return S.fav.map(k=>{const[id,j]=k.split("#");return[S.cols.findIndex(c=>String(c.id)===id),+j]}).filter(r=>r[0]>=0&&S.cols[r[0]].poems[r[1]]!=null)}
function stage(){const r=NAV.l[NAV.i];return `<div class="stage" onclick="zone(event)"><span class="chev" style="left:-4px">‹</span><span class="chev" style="right:-4px">›</span>${card(r)}<div class="cnt">${NAV.i+1} / ${NAV.l.length}</div></div>`}
function zone(e){if(e.target.closest("button,a,label"))return;const x=e.clientX/innerWidth;if(x<.35)step(-1);else if(x>.65)step(1)}
function step(d){const n=NAV.l.length;if(n<2)return;NAV.i=(NAV.i+d+n)%n;DX=d*40;paint()}
let sx=null;document.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
document.addEventListener("touchend",e=>{if(sx==null||!e.target.closest(".stage"))return;const d=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(d)>60){step(d<0?1:-1);window._sw=Date.now()}},{passive:true});
function paint(){if($("#ov").style.display==="block"&&NAV.rd){$("#rd").innerHTML=stage()}else if(tab==="today"){$("#st2").innerHTML=stage()}}
function render(){theme();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 const m=$("#m");
 if(tab==="today"){const r=draw();if(r){const l=pool();NAV={l,i:Math.max(0,l.findIndex(x=>x[0]===r[0]&&x[1]===r[1]))};DX=0}
  m.innerHTML=`<h1>Poème du jour</h1><div class="cn">今日一詩</div>`+(r?`<div id="st2">${stage()}</div><div class="row"><button class="ghost" onclick="nextTheme()">🎨 Thème</button><button class="ghost" onclick="again()">Au hasard</button><button class="ghost" onclick="openCol(${r[0]},${r[1]})">Ouvrir le recueil</button><button class="ghost" onclick="copy()">Copier</button></div>`:`<div class="card"><div class="poem" style="font-size:20px">Aucun poème pour l'instant.\nImportez vos PDF dans l'onglet « Recueils ».</div></div>`)}
 if(tab==="fav"){const f=favs();m.innerHTML=`<h1>Mes favoris</h1>`+(f.length?f.map((r,k)=>`<div class="item" onclick="openFav(${k})"><div><b>${esc(S.cols[r[0]].name)}</b><small>${esc(S.cols[r[0]].poems[r[1]].slice(0,120))}</small></div><span style="color:var(--ac);font-size:22px">♥</span></div>`).join(""):`<p class="note" style="text-align:center">Touchez le ♡ sur un poème pour le retrouver ici.</p>`)}
 if(tab==="lib"){m.innerHTML=`<h1>Mes recueils</h1><div class="row" style="margin:0 0 14px"><label class="btn" style="margin:0">+ Importer des PDF<input type="file" id="f" accept="application/pdf" multiple hidden></label></div><div class="note" id="st" style="text-align:center">${msg}</div>`+
  S.cols.map((c,i)=>`<div class="item" onclick="openCol(${i})"><div><b>${esc(c.name)}</b><small>${c.poems.length} poème(s)</small></div><button class="ghost" onclick="event.stopPropagation();tog(${i})">${c.on!==false?"Dans le tirage ✓":"Exclu"}</button></div>`).join("")+
  `<p class="note">Touchez un recueil pour le lire ou choisir un poème précis. « Dans le tirage » = inclus dans le poème du jour.</p>`;
  $("#f").onchange=e=>imp([...e.target.files])}
 if(tab==="set"){m.innerHTML=`<h1>Réglages</h1>
 <h2>Thèmes</h2><div class="tg">${THEMES.map((t,i)=>`<div class="tc" onclick="pre(${i})" style="background:${t[1]};color:${t[2]};border-color:${t[3]}${S.th===i?";box-shadow:0 0 0 3px "+t[3]:""}"><i style="color:${t[3]}">${t[7]}</i><b style="font-family:${TF[t[5]][0]};font-size:${18*Math.min(TF[t[5]][1],1.6)}px">${t[0]}</b></div>`).join("")}</div>
 <h2>Tirage</h2><label>Poème du jour<select onchange="S.mode=this.value;save()"><option value="random"${S.mode==="random"?" selected":""}>Aléatoire</option><option value="seq"${S.mode==="seq"?" selected":""}>Dans l'ordre</option></select></label>
 <label>Découpage à l'import<select onchange="S.split=this.value;save()"><option value="page"${S.split==="page"?" selected":""}>1 page = 1 poème</option><option value="bloc"${S.split==="bloc"?" selected":""}>Séparés par grands blancs</option></select></label>
 <h2>Rappels</h2>${S.times.map((t,i)=>`<label><input type="time" value="${t}" onchange="S.times[${i}]=this.value;save()"><button class="ghost" onclick="S.times.splice(${i},1);save();render()">Retirer</button></label>`).join("")}
 <div class="row" style="justify-content:flex-start"><button class="ghost" onclick="S.times.push('12:00');save();render()">+ Ajouter une heure</button><button class="ghost" onclick="perm()">Autoriser les notifications</button></div>
 <p class="note">Les rappels sont programmés sur 3 semaines et reprogrammés à chaque ouverture de l'appli.</p>
 <h2>Apparence</h2>
 <label>Fond<input type="color" value="${S.bg}" onchange="S.bg=this.value;save();render()"></label>
 <label>Texte<input type="color" value="${S.fg}" onchange="S.fg=this.value;save();render()"></label>
 <label>Accent<input type="color" value="${S.ac}" onchange="S.ac=this.value;save();render()"></label>
 <label>Police des titres<select onchange="S.tf=this.value;save();render()">${Object.keys(TF).map(f=>`<option${f===S.tf?" selected":""}>${f}</option>`).join("")}</select></label>
 <label>Décor<select onchange="S.deco=this.value;save();render()">${["bambou","prunier","montagnes","nuages","lotus","pivoine","automne","chrysantheme","orchidee","treillis","aucun"].map(f=>`<option${f===S.deco?" selected":""}>${f}</option>`).join("")}</select></label>
 <label>Police du poème<select onchange="S.font=this.value;save();render()">${Object.keys(FONTS).map(f=>`<option${f===S.font?" selected":""}>${f}</option>`).join("")}</select></label>
 <label>Poème en italique<input type="checkbox" ${S.ital?"checked":""} onchange="S.ital=this.checked;save();theme()"></label>
 <label>Taille<input type="range" min="15" max="36" value="${S.size}" oninput="S.size=+this.value;theme()" onchange="save()"></label>
 <div class="card" style="margin-top:20px"><div class="poem" style="font-size:var(--size)">Aperçu : la beauté se cache\nau détour d'un vers.</div></div>`}}
function pre(i){const t=THEMES[i];[S.bg,S.fg,S.ac,S.deco,S.tf,S.font,S.glyph,S.seal]=t.slice(1);S.th=i;save();render()}
function nextTheme(){pre((S.th+1)%THEMES.length)}
function again(){DX=0;draw(true);render()}
function copy(){const r=S.daily.r;navigator.clipboard&&navigator.clipboard.writeText(S.cols[r[0]].poems[r[1]]+"\n— "+S.cols[r[0]].name)}
function tog(i){S.cols[i].on=S.cols[i].on===false;S.daily=null;save();render()}
function openFav(k){const l=favs();NAV={l,i:k,rd:1};DX=0;const o=$("#ov");o.style.display="block";o.innerHTML=`<div><div class="row" style="margin:0 0 14px"><button class="ghost" onclick="closeOv();render()">← Retour</button></div><div id="rd">${stage()}</div></div>`}
function openCol(i,j){const c=S.cols[i],o=$("#ov");o.style.display="block";
 if(j!=null){NAV={l:c.poems.map((_,k)=>[i,k]),i:j,rd:1};DX=0;o.innerHTML=`<div><div class="row" style="margin:0 0 14px"><button class="ghost" onclick="openCol(${i})">← Liste</button></div><div id="rd">${stage()}</div></div>`;scrollTo(0,0);return}
 NAV.rd=0;o.innerHTML=`<div><div class="row" style="margin:0 0 6px"><button class="ghost" onclick="closeOv()">← Retour</button><button class="ghost" onclick="openCol(${i},${Math.floor(Math.random()*c.poems.length)})">Au hasard</button><button class="ghost" onclick="del(${i})">Supprimer</button></div><h1>${esc(c.name)}</h1>`+c.poems.map((p,k)=>`<div class="item" onclick="openCol(${i},${k})"><div><b>${k+1}.</b><small>${esc(p.slice(0,120))}</small></div></div>`).join("")+`</div>`}
function closeOv(){$("#ov").style.display="none";NAV.rd=0}
function del(i){if(confirm("Supprimer ce recueil ?")){S.cols.splice(i,1);S.daily=null;save();closeOv();render()}}
async function imp(files){const st=$("#st");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
 for(const f of files){try{st.textContent="Lecture de "+f.name+"…";const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;const poems=[];
  for(let n=1;n<=d.numPages;n++){const tc=await(await d.getPage(n)).getTextContent();const L=[];let y=null;
   for(const it of tc.items){const yy=it.transform[5];if(y!==null&&Math.abs(yy-y)<2&&L.length)L[L.length-1].t+=it.str;else{L.push({t:it.str,g:y===null?0:y-yy})}y=yy}
   const gs=L.map(l=>l.g).filter(g=>g>0).sort((a,b)=>a-b),med=gs[Math.floor(gs.length/2)]||12;
   const th=S.split==="page"?1.4:2.2;let cur=[];const flush=()=>{const t=cur.join("\n").trim();if(t.length>15)poems.push(t);cur=[]};
   for(const l of L){if(S.split==="bloc"&&l.g>med*th)flush();else if(S.split==="page"&&l.g>med*th)cur.push("");cur.push(l.t.trim())}flush()}
  if(S.split==="page"){}
  S.cols.push({id:Date.now()+Math.random(),name:f.name.replace(/\.pdf$/i,""),poems,on:true});save();msg=`${f.name} : ${poems.length} poème(s).`}catch(e){msg="Erreur de lecture : "+f.name}}
 S.daily=null;render()}
function perm(){if(LN()){sched();return}try{Notification.requestPermission()}catch(e){}}
function tick(){const n=new Date(),hm=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"),k=today()+hm;
 if(S.times.includes(hm)&&S.fired!==k&&pool().length){S.fired=k;const r=draw(false);save();
  try{new Notification("Poème du jour",{body:S.cols[r[0]].poems[r[1]].slice(0,120)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  NAV={l:[r],i:0,rd:1};const o=$("#ov");o.style.display="block";o.innerHTML=`<div><div class="row" style="margin:0 0 14px"><button class="ghost" onclick="closeOv()">Fermer</button></div><h1>C'est l'heure de votre poème</h1><div id="rd">${stage()}</div></div>`}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;closeOv();render()});
setInterval(tick,15000);render();setTimeout(sched,2500);
</script></body></html>
